plugins {
    id 'com.android.application'
}

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('signing.properties')
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace = 'com.bigsing.fakemap'
    compileSdk = 37

    defaultConfig {
        applicationId = 'com.bigsing.fakemap'
        minSdk = 23
        targetSdk = 37
        versionCode = 20
        versionName = '2.0.0'

        testInstrumentationRunner = 'android.test.InstrumentationTestRunner'
    }

    flavorDimensions += 'xposedApi'
    productFlavors {
        legacy {
            dimension = 'xposedApi'
            buildConfigField 'String', 'XPOSED_API_KIND', '"legacy"'
        }
        modern {
            dimension = 'xposedApi'
            // libxposed's modern API is designed for Android 8.1+ runtimes.
            minSdk = 27
            buildConfigField 'String', 'XPOSED_API_KIND', '"modern"'
        }
    }

    signingConfigs {
        release {
            if (signingPropertiesFile.exists()) {
                storeFile = rootProject.file(signingProperties['storeFile'])
                storePassword = signingProperties['storePassword']
                keyAlias = signingProperties['keyAlias']
                keyPassword = signingProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix = '.debug'
            versionNameSuffix = '-debug'
        }
        release {
            debuggable = false
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig = true
    }

    packaging {
        resources {
            merges += ['META-INF/xposed/*']
        }
    }

    lint {
        abortOnError = true
        checkReleaseBuilds = true
        disable 'ExpiredTargetSdkVersion'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

androidComponents {
    onVariants(selector().withBuildType('release')) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set(
                    "FakeMap-release-${output.versionName.get()}-${variant.flavorName}.apk")
        }
    }
}

dependencies {
    legacyCompileOnly files('libs/XposedBridge_89.jar')
    modernCompileOnly('io.github.libxposed:api:102.0.0') {
        transitive = false
    }
    modernImplementation 'io.github.libxposed:service:102.0.0'
    testImplementation 'junit:junit:4.13.2'
}
